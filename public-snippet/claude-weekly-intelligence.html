<!--
  Claude Weekly Intelligence — drop-in card
  ==========================================
  This isn't a full page — it's the one card, self-contained, meant to be
  pasted into your existing public/index.html (wherever the other account
  cards live) and matched to your existing card CSS classes.

  1. Copy the <div class="card" ...> block below into your dashboard's card
     grid, once per account. Replace ACCOUNT_ID with the id from accounts.json
     (e.g. "healther", "community", "mompooch", "malayalam").
  2. Copy the <style> block into your stylesheet (skip any rule that
     collides with a class name you already use — rename if needed).
  3. Copy the <script> block near the end of your page, after the DOM it
     targets exists.
  4. If your existing cards use different class names for buttons/pills,
     swap them in below instead of introducing a second style language.
-->

<div class="card claude-weekly-card" data-account="ACCOUNT_ID">
  <div class="claude-weekly-header">
    <h3>🤖 Claude Weekly Intelligence</h3>
    <span class="claude-weekly-period">—</span>
  </div>

  <div class="claude-weekly-body">
    <p class="claude-weekly-loading">Loading this week's analysis…</p>
  </div>

  <div class="claude-weekly-actions">
    <button type="button" class="btn-view-full">View Full Analysis</button>
    <button type="button" class="btn-regenerate">Regenerate Analysis</button>
    <button type="button" class="btn-report">Generate Report</button>
  </div>

  <p class="claude-weekly-disclaimer">AI analysis generated by Claude using your account's analytics data.</p>
</div>

<!-- Full-analysis modal (one for the whole page; reused by every card) -->
<div id="claude-weekly-modal" class="claude-weekly-modal" hidden>
  <div class="claude-weekly-modal-content">
    <button type="button" class="claude-weekly-modal-close" aria-label="Close">&times;</button>
    <div class="claude-weekly-modal-body"></div>
  </div>
</div>

<style>
.claude-weekly-card { display: flex; flex-direction: column; gap: 12px; }
.claude-weekly-header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.claude-weekly-header h3 { margin: 0; font-size: 1.05rem; }
.claude-weekly-period { font-size: 0.8rem; opacity: 0.65; }
.claude-weekly-body { font-size: 0.9rem; line-height: 1.5; }
.claude-weekly-loading, .claude-weekly-error { opacity: 0.7; font-style: italic; }
.claude-weekly-section { margin-bottom: 10px; }
.claude-weekly-section h4 { margin: 0 0 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.7; }
.claude-weekly-section ul { margin: 0; padding-left: 18px; }
.claude-weekly-up { color: #1a7f37; }
.claude-weekly-down { color: #c0362c; }
.claude-weekly-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.claude-weekly-actions button {
  font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15);
  background: transparent; cursor: pointer;
}
.claude-weekly-actions button:hover { background: rgba(0,0,0,0.05); }
.claude-weekly-actions button:disabled { opacity: 0.5; cursor: wait; }
.claude-weekly-disclaimer { margin: 0; font-size: 0.7rem; opacity: 0.55; }

.claude-weekly-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px;
}
.claude-weekly-modal[hidden] { display: none; }
.claude-weekly-modal-content {
  background: var(--card-bg, #fff); color: inherit; max-width: 720px; width: 100%;
  max-height: 85vh; overflow: auto; border-radius: 10px; padding: 24px; position: relative;
}
.claude-weekly-modal-close {
  position: absolute; top: 12px; right: 16px; background: none; border: none;
  font-size: 1.4rem; cursor: pointer; line-height: 1;
}
</style>

<script>
(function () {
  const fmtPct = (v) => (v == null ? '–' : `${v > 0 ? '+' : ''}${v}%`);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderCard(card, record) {
    const period = card.querySelector('.claude-weekly-period');
    const body = card.querySelector('.claude-weekly-body');
    const btnRegen = card.querySelector('.btn-regenerate');
    const btnView = card.querySelector('.btn-view-full');
    const btnReport = card.querySelector('.btn-report');

    if (!record || !record.analysis) {
      period.textContent = '';
      body.innerHTML = `<p class="claude-weekly-error">${esc(record?.message || 'No analysis yet — click "Regenerate Analysis" to generate this week\'s report.')}</p>`;
      btnView.disabled = true;
      btnReport.disabled = true;
      return;
    }

    const a = record.analysis;
    period.textContent = `Week: ${record.period_label || ''}`;
    btnView.disabled = false;
    btnReport.disabled = false;

    const improvedList = (a.improvements || []).slice(0, 4)
      .map((i) => `<li class="claude-weekly-up">📈 ${esc(i.metric)} ${fmtPct(i.change_pct)}</li>`).join('');
    const declinedList = (a.declines || []).slice(0, 4)
      .map((d) => `<li class="claude-weekly-down">📉 ${esc(d.metric)} ${fmtPct(d.change_pct)}</li>`).join('');
    const topPosts = (a.top_posts || []).slice(0, 3)
      .map((p) => `<li><strong>${esc(p.platform)}</strong> — ${esc(p.caption_or_title).slice(0, 80)}${p.url ? ` — <a href="${esc(p.url)}" target="_blank" rel="noopener">link</a>` : ''}</li>`).join('');
    const patterns = (a.content_patterns || []).slice(0, 3).map((s) => `<li>${esc(s)}</li>`).join('');
    const recs = (a.recommendations || []).slice(0, 4).map((s) => `<li>${esc(s)}</li>`).join('');
    const plan = (a.next_week_plan || []).slice(0, 7)
      .map((p) => `<li><strong>${esc(p.day)}</strong> — ${esc(p.platform)} — ${esc(p.format)}: ${esc(p.topic)}</li>`).join('');

    body.innerHTML = `
      <p>${esc(a.executive_summary || '')}</p>
      ${improvedList ? `<div class="claude-weekly-section"><h4>📈 Improved</h4><ul>${improvedList}</ul></div>` : ''}
      ${declinedList ? `<div class="claude-weekly-section"><h4>📉 Declined</h4><ul>${declinedList}</ul></div>` : ''}
      ${topPosts ? `<div class="claude-weekly-section"><h4>🔥 Top Content</h4><ul>${topPosts}</ul></div>` : ''}
      ${patterns ? `<div class="claude-weekly-section"><h4>🧠 What Claude Found</h4><ul>${patterns}</ul></div>` : ''}
      ${recs ? `<div class="claude-weekly-section"><h4>🎯 Next Week</h4><ul>${recs}</ul></div>` : ''}
      ${plan ? `<div class="claude-weekly-section"><h4>📅 Suggested Content Plan</h4><ul>${plan}</ul></div>` : ''}
    `;
  }

  function renderFullAnalysis(record) {
    const a = record.analysis;
    const section = (title, items) => items && items.length
      ? `<div class="claude-weekly-section"><h4>${title}</h4><ul>${items.map((s) => `<li>${esc(typeof s === 'string' ? s : JSON.stringify(s))}</li>`).join('')}</ul></div>` : '';
    return `
      <h3>🤖 Claude Weekly Intelligence — ${esc(record.account_name)}</h3>
      <p><em>Week: ${esc(record.period_label)}</em></p>
      <p>${esc(a.executive_summary)}</p>
      ${section('📈 Improved', (a.improvements || []).map((i) => `${i.metric} ${fmtPct(i.change_pct)} — ${i.detail}`))}
      ${section('📉 Declined', (a.declines || []).map((d) => `${d.metric} ${fmtPct(d.change_pct)} — ${d.detail}`))}
      ${section('🔥 Top Content', (a.top_posts || []).map((p) => `[${p.platform}] ${p.caption_or_title} — ${p.why_it_stands_out}`))}
      ${section('🧠 Content Patterns', a.content_patterns)}
      ${section('💬 Engagement Analysis', a.engagement_analysis)}
      ${section('📊 Platform Comparison', (a.platform_comparison || []).map((p) => `${p.platform}: reach ${p.reach ?? '–'}, engagement rate ${p.engagement_rate ?? '–'}%`))}
      ${section('🗓️ Posting Consistency', [JSON.stringify(a.posting_consistency || {})])}
      ${section('🎯 Recommendations', a.recommendations)}
      ${section('📅 Next Week Content Plan', (a.next_week_plan || []).map((p) => `${p.day} — ${p.platform} — ${p.format}: ${p.topic} — ${p.reason}`))}
      ${section('⚠️ Data Limitations', a.data_limitations)}
      <p class="claude-weekly-disclaimer">AI analysis generated by Claude using your account's analytics data.</p>
    `;
  }

  async function loadCard(card) {
    const account = card.dataset.account;
    try {
      const res = await fetch(`/api/weekly-analysis/${account}`);
      const record = await res.json();
      card.dataset.record = JSON.stringify(record);
      renderCard(card, record.analysis ? record : null);
    } catch (e) {
      card.querySelector('.claude-weekly-body').innerHTML = `<p class="claude-weekly-error">Could not load analysis: ${esc(e.message)}</p>`;
    }
  }

  document.querySelectorAll('.claude-weekly-card').forEach((card) => {
    loadCard(card);

    card.querySelector('.btn-regenerate').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Regenerating…';
      try {
        const res = await fetch(`/api/weekly-analysis/${card.dataset.account}/regenerate`, { method: 'POST' });
        const record = await res.json();
        if (!res.ok) throw new Error(record.error || 'Failed');
        card.dataset.record = JSON.stringify(record);
        renderCard(card, record);
      } catch (err) {
        card.querySelector('.claude-weekly-body').innerHTML = `<p class="claude-weekly-error">${esc(err.message)}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Regenerate Analysis';
      }
    });

    card.querySelector('.btn-view-full').addEventListener('click', () => {
      const record = JSON.parse(card.dataset.record || 'null');
      if (!record || !record.analysis) return;
      const modal = document.getElementById('claude-weekly-modal');
      modal.querySelector('.claude-weekly-modal-body').innerHTML = renderFullAnalysis(record);
      modal.hidden = false;
    });

    card.querySelector('.btn-report').addEventListener('click', () => {
      window.open(`/api/weekly-analysis/${card.dataset.account}/report`, '_blank');
    });
  });

  const modal = document.getElementById('claude-weekly-modal');
  if (modal) {
    modal.querySelector('.claude-weekly-modal-close').addEventListener('click', () => { modal.hidden = true; });
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });
  }
})();
</script>
