services:
  - type: web
    name: healther-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: META_ACCESS_TOKEN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_USER
        value: healther
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5-20250929
